name: "tattoo_studio_analytics"
version: "1.0.0"
config-version: 2

profile: "tattoo_studio_analytics"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Local dev source for the raw sheet extracts. Points at the Parquet
  # files produced by ingest/sheets_extractor.py. Overridden to an S3
  # path (raw/) once querying through Athena instead of local DuckDB.
  raw_data_dir: "../ingest/data/tmp"

models:
  tattoo_studio_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
